---
name: quality-review-pr

# Runs the abuzucom/agents-personas euler quality review on infiniteprep pull
# requests after the ci workflow completes. The wrapper loads the engine, the
# euler policy, and the model adapter from the pinned agents-personas commit.
#
# The workflow_run trigger runs default-branch code. Pull request files stay
# review data. The engine publishes a skipped "euler / quality" check for a
# fork pull request and withholds the provider key from it.

"on":
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches-ignore:
      - main

# Each job declares only the permissions it uses.
permissions:
  contents: read

jobs:
  resolve:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: read
      contents: read
      pull-requests: read
    outputs:
      found: ${{ steps.pr.outputs.found }}
      same_repo: ${{ steps.pr.outputs.same_repo }}
      already_reviewed: ${{ steps.pr.outputs.already_reviewed }}
      number: ${{ steps.pr.outputs.number }}
      base_sha: ${{ steps.pr.outputs.base_sha }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      head_repo_url: ${{ steps.pr.outputs.head_repo_url }}
      head_repo_full_name: ${{ steps.pr.outputs.head_repo_full_name }}
    steps:
      - name: Resolve pull request from the head revision
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          script: |
            const headSha = process.env.HEAD_SHA;
            if (!/^[0-9a-f]{40}$/.test(headSha || '')) {
              core.setFailed('review head SHA is invalid');
              return;
            }
            const pulls = await github.paginate(github.rest.pulls.list, { ...context.repo, state: 'open' });
            const matches = pulls.filter((pull) => pull.head.sha === headSha);
            if (matches.length !== 1) {
              core.setOutput('found', 'false');
              return;
            }
            const pull = matches[0];
            const headRepository = pull.head?.repo;
            if (!headRepository?.full_name || !headRepository.clone_url) {
              core.setFailed('pull request head repository metadata is unavailable');
              return;
            }

            // The engine reruns a passing review. The caller skips a head
            // with an Actions check that already carries a verdict title.
            const existingChecks = await github.paginate(
              github.rest.checks.listForRef,
              { ...context.repo, ref: headSha, check_name: 'euler / quality', per_page: 100 },
            );
            const alreadyReviewed = existingChecks.some((check) =>
              check.app?.slug === 'github-actions' &&
              check.status === 'completed' &&
              /^VERDICT: (APPROVE|BLOCK|NEEDS-HUMAN)$/.test(check.output?.title || ''));

            core.setOutput('found', 'true');
            const sameRepo = headRepository.full_name === pull.base.repo.full_name;
            core.setOutput('same_repo', String(sameRepo));
            core.setOutput('already_reviewed', alreadyReviewed ? 'true' : 'false');
            core.setOutput('number', String(pull.number));
            core.setOutput('base_sha', pull.base.sha);
            core.setOutput('head_sha', pull.head.sha);
            core.setOutput('head_repo_url', headRepository.clone_url);
            core.setOutput('head_repo_full_name', headRepository.full_name);

  # Sorts the pull request into a change class. The classifier comes from the
  # default branch. The job fetches the pull request head commit as Git
  # objects only. No pull request file reaches a working tree, and no pull
  # request file runs. The job holds a read-only token and no secret. A fork
  # pull request gets no classification. The review job then runs, and the
  # engine publishes the skipped fork check.
  classify:
    needs: resolve
    if: >-
      needs.resolve.outputs.found == 'true' &&
      needs.resolve.outputs.already_reviewed != 'true' &&
      needs.resolve.outputs.same_repo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      change_class: ${{ steps.classify.outputs.change_class }}
    steps:
      # A workflow_run job checks out the default branch when no ref is named.
      - name: Check out the trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: trusted-base
          persist-credentials: false
          fetch-depth: 0

      # The base repository serves a fork head through its pull request ref.
      # The token reaches only this fetch, through a one-command header. The
      # checkout above keeps no credential.
      - name: Fetch the pull request head commit
        working-directory: trusted-base
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
        run: |
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid head commit."; exit 1; }
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            fetch --no-tags origin "$HEAD_SHA"

      - name: Classify changed paths
        id: classify
        working-directory: trusted-base
        env:
          BASE_SHA: ${{ needs.resolve.outputs.base_sha }}
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
        run: python3 scripts/classify_changed_paths.py --base "$BASE_SHA" --head "$HEAD_SHA"

  # A docs-only pull request skips the model review. The status function
  # replaces the implicit success check on needs. A failed classify job
  # yields no class, and the review then runs.
  review:
    needs: [resolve, classify]
    # The wrapper posts a pull request comment and publishes a check run.
    permissions:
      checks: write
      contents: read
      pull-requests: write
    if: >-
      ${{ !cancelled() && needs.resolve.outputs.found == 'true' &&
      needs.resolve.outputs.already_reviewed != 'true' &&
      needs.classify.outputs.change_class != 'docs' }}
    # agents-personas 0.22.0. Keep the uses: pin and personas_ref on the same commit.
    uses: abuzucom/agents-personas/.github/workflows/euler-quality-review.yml@c43f4592191b42b9f66072622b082fc2f4dc3217
    with:
      personas_ref: "c43f4592191b42b9f66072622b082fc2f4dc3217"
      pr_number: ${{ needs.resolve.outputs.number }}
      base_sha: ${{ needs.resolve.outputs.base_sha }}
      head_sha: ${{ needs.resolve.outputs.head_sha }}
      head_repo_url: ${{ needs.resolve.outputs.head_repo_url }}
      head_repo_full_name: ${{ needs.resolve.outputs.head_repo_full_name }}
      fail_on_block: true
      exclude_paths: ""
    secrets:
      MODEL_API_KEY: ${{ secrets.OLLAMA_API_KEY }}

  # The check keeps its name on a docs-only pull request. A required
  # euler / quality check then reports a result.
  docs-only-skipped:
    needs: [resolve, classify]
    if: needs.classify.outputs.change_class == 'docs'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: write
    steps:
      - name: Publish skip result
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
        with:
          script: |
            await github.rest.checks.create({
              ...context.repo,
              name: 'euler / quality',
              head_sha: process.env.HEAD_SHA,
              status: 'completed',
              conclusion: 'skipped',
              output: {
                title: 'Skipped for docs-only pull request',
                summary: 'The pull request changes documentation files only.',
              },
            });
