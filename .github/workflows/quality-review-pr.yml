---
name: quality-review-pr

# Runs the euler quality review on infiniteprep pull requests. The
# workflow_run trigger runs default-branch code after ci completes. Pull
# request files stay review data. Fork pull requests receive an explicit skip
# result and no secret.

"on":
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches-ignore:
      - main

# Each job declares only the permissions it uses.
permissions:
  contents: read

jobs:
  resolve:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      found: ${{ steps.pr.outputs.found }}
      same_repo: ${{ steps.pr.outputs.same_repo }}
      number: ${{ steps.pr.outputs.number }}
      base_sha: ${{ steps.pr.outputs.base_sha }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      title: ${{ steps.pr.outputs.title }}
      body: ${{ steps.pr.outputs.body }}
    steps:
      - name: Resolve pull request from the head revision
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          script: |
            const headSha = process.env.HEAD_SHA;
            const pulls = await github.paginate(github.rest.pulls.list, { ...context.repo, state: 'open' });
            const matches = pulls.filter((pull) => pull.head.sha === headSha);
            if (matches.length !== 1) {
              core.setOutput('found', 'false');
              return;
            }
            const pull = matches[0];
            core.setOutput('found', 'true');
            const sameRepo = Boolean(pull.head.repo) && pull.head.repo.full_name === pull.base.repo.full_name;
            core.setOutput('same_repo', String(sameRepo));
            core.setOutput('number', String(pull.number));
            core.setOutput('base_sha', pull.base.sha);
            core.setOutput('head_sha', pull.head.sha);
            core.setOutput('title', pull.title || '');
            core.setOutput('body', pull.body || '');

  # Sorts the pull request into a change class. The classifier comes from the
  # default branch. The job fetches the pull request head commit as Git
  # objects only. No pull request file reaches a working tree, and no pull
  # request file runs. The job holds a read-only token and no secret.
  classify:
    needs: resolve
    if: needs.resolve.outputs.found == 'true' && needs.resolve.outputs.same_repo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      change_class: ${{ steps.classify.outputs.change_class }}
    steps:
      # A workflow_run job checks out the default branch when no ref is named.
      - name: Check out the trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: trusted-base
          persist-credentials: false
          fetch-depth: 0

      # The token reaches only this fetch, through a one-command header.
      # The checkout above keeps no credential.
      - name: Fetch the pull request head commit
        working-directory: trusted-base
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
        run: |
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid head commit."; exit 1; }
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            fetch --no-tags origin "$HEAD_SHA"

      - name: Classify changed paths
        id: classify
        working-directory: trusted-base
        env:
          BASE_SHA: ${{ needs.resolve.outputs.base_sha }}
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
        run: python3 scripts/classify_changed_paths.py --base "$BASE_SHA" --head "$HEAD_SHA"

  # A docs-only pull request skips the model review. The status function
  # replaces the implicit success check on needs. A failed classify job
  # yields no class, and the review then runs.
  review:
    needs: [resolve, classify]
    permissions:
      contents: read
      actions: read
      pull-requests: write
      checks: write
    if: >-
      ${{ !cancelled() && needs.resolve.outputs.found == 'true' &&
      needs.resolve.outputs.same_repo == 'true' &&
      needs.classify.outputs.change_class != 'docs' }}
    # Euler 0.6.5. Keep the uses: pin and quality_ref on the same commit.
    uses: abuzucom/euler/.github/workflows/quality-review.yml@1a3f67cba9d6ed7f45af4822f9ca27dd14db6a46
    with:
      pr_number: ${{ fromJSON(needs.resolve.outputs.number) }}
      base_sha: ${{ needs.resolve.outputs.base_sha }}
      head_sha: ${{ needs.resolve.outputs.head_sha }}
      pr_title: ${{ needs.resolve.outputs.title }}
      pr_body: ${{ needs.resolve.outputs.body }}
      quality_ref: "1a3f67cba9d6ed7f45af4822f9ca27dd14db6a46"
      fail_on_block: true
      exclude_paths: ""
    secrets:
      MODEL_API_KEY: ${{ secrets.OLLAMA_API_KEY }}

  fork-skip:
    needs: resolve
    if: needs.resolve.outputs.found == 'true' && needs.resolve.outputs.same_repo != 'true'
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - name: Publish skip result
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
        with:
          script: |
            await github.rest.checks.create({
              ...context.repo,
              name: 'quality-review',
              head_sha: process.env.HEAD_SHA,
              status: 'completed',
              conclusion: 'skipped',
              output: {
                title: 'Skipped for fork pull request',
                summary: 'Fork pull requests receive no provider secret.',
              },
            });

  # The check keeps its name on a docs-only pull request. A required
  # quality-review check then reports a result.
  docs-only-skipped:
    needs: [resolve, classify]
    if: needs.classify.outputs.change_class == 'docs'
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - name: Publish skip result
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
        with:
          script: |
            await github.rest.checks.create({
              ...context.repo,
              name: 'quality-review',
              head_sha: process.env.HEAD_SHA,
              status: 'completed',
              conclusion: 'skipped',
              output: {
                title: 'Skipped for docs-only pull request',
                summary: 'The pull request changes documentation files only.',
              },
            });
