---
name: build-packages

# Builds the PyInstaller bundle on each target OS and runs the built app's
# smoke check. Runs only when started by hand (D248). A later D83a change adds
# the release tag trigger. Each run keeps its bundles for 3 days (D255).

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    name: bundle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Pinned images (D251). Ubuntu 22.04 sets the glibc 2.35 baseline (D252).
        os: [windows-2025, macos-14, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - name: Install Linux Qt headless system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libglib2.0-0 \
            libdbus-1-3 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xfixes0 \
            libfontconfig1 \
            libpulse0 \
            libsndfile1

      - name: Install locked dependencies and package
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-deps -e .

      - name: Build bundle
        run: pyinstaller --noconfirm infiniteprep.spec

      # The built app loads its libraries and Qt offscreen, then writes its
      # version. A missing library or plugin fails here.
      - name: Smoke-check built app
        shell: bash
        run: |
          app="dist/InfinitePrep/InfinitePrep"
          if [ "$RUNNER_OS" = "Windows" ]; then app="$app.exe"; fi
          result="$RUNNER_TEMP/smoke-version.txt"
          "$app" --smoke-check "$result"
          expected="$(python -c 'import infiniteprep; print(infiniteprep.__version__)')"
          actual="$(cat "$result")"
          if [ "$actual" != "$expected" ]; then
            echo "Smoke check wrote '$actual', expected '$expected'."
            exit 1
          fi
          echo "Smoke check passed for version $actual."

      - name: Upload bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: InfinitePrep-${{ matrix.os }}
          path: dist/InfinitePrep
          retention-days: 3
          if-no-files-found: error
