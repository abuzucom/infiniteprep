---
name: build-packages

# Builds the PyInstaller bundle on each target OS and runs the built app's
# smoke check. A manual run builds and tests only (D248). A pushed v* tag also
# checks the tag, then uploads every package to a draft release (D314 to D318).
# Each run keeps its bundles for 3 days (D255).

"on":
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # A tag must match every version file and point to a commit on main (D317).
  # A manual run started on a tag also has ref_type tag. The event check keeps
  # manual runs from releasing (D248).
  check-tag:
    name: check-tag
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - name: Check tag against version files
        run: python packaging/release.py check-tag "$GITHUB_REF_NAME"

      - name: Check tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME points to $GITHUB_SHA, which is not on main. Tag a main commit."
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME points to a commit on main."

  bundle:
    name: bundle (${{ matrix.os }})
    needs: check-tag
    # A manual run skips check-tag. A tag run builds only after check-tag passes.
    if: ${{ !cancelled() && (needs.check-tag.result == 'success' || needs.check-tag.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        # Pinned images (D251). Ubuntu 22.04 sets the glibc 2.35 baseline (D252).
        os: [windows-2025, macos-15, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - name: Install Linux Qt headless system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libglib2.0-0 \
            libdbus-1-3 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xfixes0 \
            libfontconfig1 \
            libpulse0 \
            libsndfile1 \
            xvfb

      - name: Install locked dependencies and package
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-deps -e .

      # The lock file and pyproject.toml can drift apart. pip check fails when an
      # installed package, the app included, misses or conflicts with a requirement.
      - name: Check installed requirements
        run: python -m pip check

      - name: Generate Python SBOM
        shell: bash
        run: |
          tool_venv="$RUNNER_TEMP/cyclonedx-tool"
          python -m venv "$tool_venv"
          if [ "$RUNNER_OS" = "Windows" ]; then
            tool_python="$tool_venv/Scripts/python.exe"
            cyclonedx_command="$tool_venv/Scripts/cyclonedx-py.exe"
          else
            tool_python="$tool_venv/bin/python"
            cyclonedx_command="$tool_venv/bin/cyclonedx-py"
          fi
          "$tool_python" -m pip install --require-hashes --only-binary=:all: \
            -r requirements-sbom.txt
          sbom_path="$RUNNER_TEMP/InfinitePrep-python-$RUNNER_OS.cdx.json"
          app_python="$(python -c 'import sys; print(sys.executable)')"
          "$cyclonedx_command" environment "$app_python" -E \
            --output-format JSON --output-file "$sbom_path"

      - name: Build bundle
        run: pyinstaller --noconfirm infiniteprep.spec

      # The built app loads its libraries and Qt offscreen, then writes its
      # version. A missing library or plugin fails here.
      - name: Smoke-check built app
        shell: bash
        run: |
          app="dist/InfinitePrep/InfinitePrep"
          if [ "$RUNNER_OS" = "Windows" ]; then app="$app.exe"; fi
          result="$RUNNER_TEMP/smoke-version.txt"
          "$app" --smoke-check "$result"
          expected="$(python -c 'import infiniteprep; print(infiniteprep.__version__)')"
          actual="$(cat "$result")"
          if [ "$actual" != "$expected" ]; then
            echo "Smoke check wrote '$actual', expected '$expected'."
            exit 1
          fi
          echo "Smoke check passed for version $actual."

      # The spec prunes Linux libraries that no kept binary links against (D304).
      # The offscreen smoke check above cannot catch a library that only a real
      # display needs, so the app also starts on X11 under Xvfb.
      - name: Start built app on X11
        if: runner.os == 'Linux'
        shell: bash
        run: |
          result="$RUNNER_TEMP/x11-smoke-version.txt"
          QT_QPA_PLATFORM=xcb xvfb-run --auto-servernum \
            dist/InfinitePrep/InfinitePrep --smoke-check "$result"
          expected="$(python -c 'import infiniteprep; print(infiniteprep.__version__)')"
          if [ "$(cat "$result")" != "$expected" ]; then
            echo 'The X11 start reported the wrong version.'
            exit 1
          fi
          echo "X11 start passed for version $expected."

      # ICU 73.2 ships inside the PySide6 wheel without its license text. The
      # ICU license requires its notice with every copy (D310). The file must
      # match its pinned SHA-256 before it joins any bundle.
      - name: Fetch pinned ICU license
        shell: bash
        env:
          ICU_LICENSE_URL: https://raw.githubusercontent.com/unicode-org/icu/release-73-2/icu4c/LICENSE
          ICU_LICENSE_SHA256: f3005e195ff74d8812cc1f182a1c446fab678d70a10e3dada497585befee5416
        run: |
          mkdir -p "$RUNNER_TEMP/icu"
          license="$RUNNER_TEMP/icu/ICU-LICENSE.txt"
          curl --fail --location --silent --show-error -o "$license" "$ICU_LICENSE_URL"
          python - "$license" "$ICU_LICENSE_SHA256" <<'PY'
          import hashlib
          import sys
          from pathlib import Path

          actual = hashlib.sha256(Path(sys.argv[1]).read_bytes()).hexdigest()
          if actual != sys.argv[2]:
              sys.exit(f"ICU license SHA-256 is {actual}, expected {sys.argv[2]}.")
          print("ICU license matches its pinned SHA-256.")
          PY

      # The LGPL notices and the ICU license must ship with every bundle and
      # package (D270, D310).
      - name: Add license notices to bundle
        shell: bash
        run: cp LICENSE NOTICE "$RUNNER_TEMP/icu/ICU-LICENSE.txt" dist/InfinitePrep/

      # Each file must match a pattern in the OS allowlist. A Qt tool, a
      # GPL-3-only Qt module, or GNU Readline fails the check. The notices
      # must sit at the bundle root (D231, D300, D301).
      - name: Check bundle contents
        shell: bash
        run: |
          os_name="$(printf '%s' "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')"
          python packaging/check_bundle.py dist/InfinitePrep "$os_name"

      - name: Upload Python SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: InfinitePrep-python-sbom-${{ matrix.os }}
          path: ${{ runner.temp }}/InfinitePrep-python-${{ runner.os }}.cdx.json
          retention-days: 3
          if-no-files-found: error

      - name: Upload bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: InfinitePrep-${{ matrix.os }}
          path: dist/InfinitePrep
          retention-days: 3
          if-no-files-found: error

      # The portable ZIP carries portable.mode, so its copy keeps its library
      # in a Data folder beside the exe (D83a1a).
      - name: Build Windows portable ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (python -c 'import infiniteprep; print(infiniteprep.__version__)').Trim()
          $staging = Join-Path $env:RUNNER_TEMP 'portable'
          New-Item -ItemType Directory -Force $staging | Out-Null
          Copy-Item -Recurse dist\InfinitePrep (Join-Path $staging 'InfinitePrep')
          New-Item -ItemType File (Join-Path $staging 'InfinitePrep\portable.mode') | Out-Null
          $zip = "dist\InfinitePrep-$version-windows-x64-portable.zip"
          Compress-Archive -Path (Join-Path $staging 'InfinitePrep') -DestinationPath $zip

      # NSIS 3.13 is a build-only tool with Rule 9 sign-off (D267). The
      # archive must match its pinned SHA-256 before anything unpacks it.
      - name: Fetch pinned NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          NSIS_URL: https://downloads.sourceforge.net/project/nsis/NSIS%203/3.13/nsis-3.13.zip
          NSIS_SHA256: ba63dffc4410ee89193e1cb5a41989991bd77c61068da17e3156d136b7b0b3d8
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'nsis-3.13.zip'
          curl.exe --fail --location --silent --show-error --output $archive $env:NSIS_URL
          if ($LASTEXITCODE -ne 0) { throw "NSIS download failed with exit code $LASTEXITCODE." }
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:NSIS_SHA256) {
            throw "NSIS archive SHA-256 is $actual, expected $env:NSIS_SHA256."
          }
          Expand-Archive $archive -DestinationPath $env:RUNNER_TEMP

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (python -c 'import infiniteprep; print(infiniteprep.__version__)').Trim()
          $makensis = Join-Path $env:RUNNER_TEMP 'nsis-3.13\makensis.exe'
          $source = (Resolve-Path dist\InfinitePrep).Path
          $output = Join-Path (Resolve-Path dist).Path "InfinitePrep-$version-windows-x64-setup.exe"
          # setup.exe and Uninstall.exe show the logo (D393).
          $icon = Join-Path $env:RUNNER_TEMP 'infiniteprep-installer.ico'
          python packaging\make_icon.py ico src\infiniteprep\ui\app-icon.png $icon
          if ($LASTEXITCODE -ne 0) { throw "make_icon.py failed with exit code $LASTEXITCODE." }
          & $makensis /V2 "/DVERSION=$version" "/DSOURCE_DIR=$source" "/DOUTPUT_FILE=$output" "/DICON_FILE=$icon" packaging\windows\installer.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed with exit code $LASTEXITCODE." }

      # Install, smoke-check, and uninstall the real setup.exe (D268). The
      # silent uninstall must remove the program and keep the user's data.
      - name: Test Windows installer lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (python -c 'import infiniteprep; print(infiniteprep.__version__)').Trim()
          $setup = (Resolve-Path "dist\InfinitePrep-$version-windows-x64-setup.exe").Path
          $installDir = Join-Path $env:RUNNER_TEMP 'install\InfinitePrep'
          $dataMarker = Join-Path $env:LOCALAPPDATA 'InfinitePrep\ci-keep.txt'
          New-Item -ItemType Directory -Force (Split-Path $dataMarker) | Out-Null
          Set-Content -Path $dataMarker -Value 'keep'

          $install = Start-Process -FilePath $setup -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Setup exited with $($install.ExitCode)." }
          $exe = Join-Path $installDir 'InfinitePrep.exe'
          if (-not (Test-Path $exe)) { throw "Setup did not install $exe." }
          foreach ($notice in 'LICENSE', 'NOTICE', 'ICU-LICENSE.txt') {
            if (-not (Test-Path (Join-Path $installDir $notice))) { throw "Setup did not install $notice." }
          }

          $result = Join-Path $env:RUNNER_TEMP 'installed-smoke.txt'
          $smoke = Start-Process -FilePath $exe -ArgumentList '--smoke-check', $result -Wait -PassThru
          if ($smoke.ExitCode -ne 0) { throw "Installed app smoke check exited with $($smoke.ExitCode)." }
          if ((Get-Content -Raw $result) -ne $version) { throw 'Installed app reported the wrong version.' }

          $startMenu = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\InfinitePrep.lnk'
          if (-not (Test-Path $startMenu)) { throw 'Start Menu shortcut is missing.' }
          $desktop = Join-Path ([Environment]::GetFolderPath('Desktop')) 'InfinitePrep.lnk'
          if (Test-Path $desktop) { throw 'Desktop shortcut appeared without being chosen.' }
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\InfinitePrep'
          if ((Get-ItemProperty $key).DisplayVersion -ne $version) { throw 'Apps and Features entry is wrong.' }

          # The uninstaller copies itself to a temp folder and returns at once,
          # so the check waits for the program folder to disappear.
          $uninstaller = Join-Path $installDir 'Uninstall.exe'
          Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait
          $deadline = (Get-Date).AddSeconds(120)
          while ((Test-Path $installDir) -and ((Get-Date) -lt $deadline)) { Start-Sleep -Seconds 2 }
          if (Test-Path $installDir) { throw 'Uninstall left the program folder behind.' }
          if (Test-Path $key) { throw 'Uninstall left the Apps and Features entry behind.' }
          if (Test-Path $startMenu) { throw 'Uninstall left the Start Menu shortcut behind.' }
          if (-not (Test-Path $dataMarker)) { throw 'Silent uninstall deleted user data.' }
          Write-Output "Installer lifecycle passed for version $version."

      - name: Upload Windows packages
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: InfinitePrep-windows-packages
          path: |
            dist/InfinitePrep-*-windows-x64-portable.zip
            dist/InfinitePrep-*-windows-x64-setup.exe
          retention-days: 3
          if-no-files-found: error

      # Two tarballs (D288). The plain one keeps per-user storage. The
      # portable one carries portable.mode, so its copy keeps its library in a
      # Data folder beside the executable (D279).
      - name: Build Linux tarballs
        if: runner.os == 'Linux'
        shell: bash
        run: |
          version="$(python -c 'import infiniteprep; print(infiniteprep.__version__)')"
          folder="InfinitePrep-$version"
          staging="$RUNNER_TEMP/tarball"
          mkdir -p "$staging"
          cp -a dist/InfinitePrep "$staging/$folder"
          tar_flags=(--owner=0 --group=0 --numeric-owner -czf)
          tar "${tar_flags[@]}" "dist/$folder-linux-x86_64.tar.gz" -C "$staging" "$folder"
          touch "$staging/$folder/portable.mode"
          tar "${tar_flags[@]}" "dist/$folder-linux-x86_64-portable.tar.gz" -C "$staging" "$folder"

      # Build-only tools with Rule 9 sign-off (D286). Each file must match its
      # pinned SHA-256 before anything runs it. The runtime becomes the start
      # of the AppImage, and NOTICE lists what it links statically.
      - name: Fetch pinned AppImage tools
        if: runner.os == 'Linux'
        shell: bash
        env:
          LINUXDEPLOY_URL: https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          LINUXDEPLOY_SHA256: c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d
          APPIMAGE_PLUGIN_URL: https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-appimage-x86_64.AppImage
          APPIMAGE_PLUGIN_SHA256: 992d502a248e14ab185448ddf6f6e7d25558cb84d4623c354c3af350c25fccb3
          RUNTIME_URL: https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
        run: |
          tools="$RUNNER_TEMP/appimage-tools"
          mkdir -p "$tools"
          cd "$tools"
          curl --fail --location --silent --show-error -o linuxdeploy-x86_64.AppImage "$LINUXDEPLOY_URL"
          curl --fail --location --silent --show-error -o linuxdeploy-plugin-appimage-x86_64.AppImage "$APPIMAGE_PLUGIN_URL"
          curl --fail --location --silent --show-error -o runtime-x86_64 "$RUNTIME_URL"
          printf '%s  %s\n' \
            "$LINUXDEPLOY_SHA256" linuxdeploy-x86_64.AppImage \
            "$APPIMAGE_PLUGIN_SHA256" linuxdeploy-plugin-appimage-x86_64.AppImage \
            "$RUNTIME_SHA256" runtime-x86_64 | sha256sum --check --strict
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-appimage-x86_64.AppImage

      # linuxdeploy runs without its Qt plugin, because PyInstaller already
      # bundles Qt (D284). The pinned runtime replaces the plugin's download
      # of a moving one (D285). The icon is the logo at 256x256, a size
      # linuxdeploy accepts (D393).
      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        env:
          # The runner has no FUSE, so each tool unpacks itself before it runs.
          APPIMAGE_EXTRACT_AND_RUN: '1'
          LDAI_NO_APPSTREAM: '1'
        run: |
          version="$(python -c 'import infiniteprep; print(infiniteprep.__version__)')"
          tools="$RUNNER_TEMP/appimage-tools"
          appdir="$RUNNER_TEMP/AppDir"
          icon="$RUNNER_TEMP/infiniteprep.png"
          mkdir -p "$appdir/usr/bin"
          cp -a dist/InfinitePrep/. "$appdir/usr/bin/"
          python "$GITHUB_WORKSPACE/packaging/make_icon.py" png "$GITHUB_WORKSPACE/src/infiniteprep/ui/app-icon.png" "$icon"
          export LDAI_RUNTIME_FILE="$tools/runtime-x86_64"
          export LDAI_OUTPUT="$GITHUB_WORKSPACE/dist/InfinitePrep-$version-linux-x86_64.AppImage"
          export LINUXDEPLOY_OUTPUT_VERSION="$version"
          log="$RUNNER_TEMP/linuxdeploy.log"
          PATH="$tools:$PATH" "$tools/linuxdeploy-x86_64.AppImage" \
            --appdir "$appdir" \
            --executable "$appdir/usr/bin/InfinitePrep" \
            --desktop-file "$GITHUB_WORKSPACE/packaging/linux/infiniteprep.desktop" \
            --icon-file "$icon" \
            --output appimage > "$log" 2>&1 || { cat "$log"; exit 1; }
          tail -n 40 "$log"
          if grep -q 'Downloading runtime' "$log"; then
            echo 'The AppImage build downloaded a runtime instead of the pinned one.'
            exit 1
          fi
          test -x "$LDAI_OUTPUT"

      # Each tarball unpacks into one versioned folder with the notices, and
      # only the portable one carries the marker. Every package must start.
      - name: Test Linux packages
        if: runner.os == 'Linux'
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          version="$(python -c 'import infiniteprep; print(infiniteprep.__version__)')"
          folder="InfinitePrep-$version"
          check_smoke() {
            local result="$RUNNER_TEMP/linux-smoke.txt"
            rm -f "$result"
            "$1" --smoke-check "$result"
            if [ "$(cat "$result")" != "$version" ]; then
              echo "$1 reported the wrong version."
              exit 1
            fi
          }
          for kind in plain portable; do
            suffix=""
            if [ "$kind" = portable ]; then suffix="-portable"; fi
            unpack="$RUNNER_TEMP/unpack-$kind"
            mkdir -p "$unpack"
            tar -xzf "dist/$folder-linux-x86_64$suffix.tar.gz" -C "$unpack"
            if [ "$(ls "$unpack")" != "$folder" ]; then
              echo "The $kind tarball does not unpack into $folder."
              exit 1
            fi
            test -f "$unpack/$folder/LICENSE"
            test -f "$unpack/$folder/NOTICE"
            test -f "$unpack/$folder/ICU-LICENSE.txt"
            if [ "$kind" = portable ]; then
              test -f "$unpack/$folder/portable.mode"
            elif [ -e "$unpack/$folder/portable.mode" ]; then
              echo 'The plain tarball carries portable.mode.'
              exit 1
            fi
            check_smoke "$unpack/$folder/InfinitePrep"
          done
          check_smoke "$GITHUB_WORKSPACE/dist/$folder-linux-x86_64.AppImage"
          echo "Linux packages passed for version $version."

      - name: Upload Linux packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: InfinitePrep-linux-packages
          path: |
            dist/InfinitePrep-*-linux-x86_64.tar.gz
            dist/InfinitePrep-*-linux-x86_64-portable.tar.gz
            dist/InfinitePrep-*-linux-x86_64.AppImage
          retention-days: 3
          if-no-files-found: error

      # The notices go inside the bundle first, then the whole app gets an
      # ad-hoc signature (D83a3c). Apple Silicon runs no unsigned code, and
      # an ad-hoc signature needs no Apple certificate. Developer ID signing
      # and notarization wait for D82.
      - name: Sign macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app="dist/InfinitePrep.app"
          cp LICENSE NOTICE "$RUNNER_TEMP/icu/ICU-LICENSE.txt" "$app/Contents/Resources/"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

      # Drag-to-install layout with the notices at the root (D298). hdiutil
      # ships with macOS, so no new build tool is needed.
      - name: Build macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          version="$(python -c 'import infiniteprep; print(infiniteprep.__version__)')"
          staging="$RUNNER_TEMP/dmg"
          mkdir -p "$staging"
          ditto dist/InfinitePrep.app "$staging/InfinitePrep.app"
          ln -s /Applications "$staging/Applications"
          cp LICENSE NOTICE "$RUNNER_TEMP/icu/ICU-LICENSE.txt" "$staging/"
          hdiutil create -volname InfinitePrep -srcfolder "$staging" -ov -format UDZO \
            "dist/InfinitePrep-$version-macos-arm64.dmg"

      # Mount the real DMG read-only, check its contents and the signed app,
      # and start the app from the mounted image.
      - name: Test macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          version="$(python -c 'import infiniteprep; print(infiniteprep.__version__)')"
          mount="$RUNNER_TEMP/dmg-mount"
          mkdir -p "$mount"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" \
            "dist/InfinitePrep-$version-macos-arm64.dmg"
          trap 'hdiutil detach "$mount"' EXIT
          app="$mount/InfinitePrep.app"
          test -L "$mount/Applications"
          test "$(readlink "$mount/Applications")" = /Applications
          for notice in LICENSE NOTICE ICU-LICENSE.txt; do
            test -f "$mount/$notice"
            test -f "$app/Contents/Resources/$notice"
          done
          codesign --verify --deep --strict "$app"
          plist="$app/Contents/Info.plist"
          read_plist() { /usr/libexec/PlistBuddy -c "Print :$1" "$plist"; }
          test "$(read_plist CFBundleIdentifier)" = dev.infiniteprep.app
          test "$(read_plist LSMinimumSystemVersion)" = 14.4
          test "$(read_plist CFBundleShortVersionString)" = "$version"
          result="$RUNNER_TEMP/dmg-smoke.txt"
          "$app/Contents/MacOS/InfinitePrep" --smoke-check "$result"
          if [ "$(cat "$result")" != "$version" ]; then
            echo 'The app in the DMG reported the wrong version.'
            exit 1
          fi
          echo "macOS DMG passed for version $version."

      - name: Upload macOS DMG
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: InfinitePrep-macos-dmg
          path: dist/InfinitePrep-*-macos-arm64.dmg
          retention-days: 3
          if-no-files-found: error

  # Only this job writes to the repository (D315). It gathers the six packages
  # from this run, attests each package and SHA256SUMS.txt (D325), saves the
  # Sigstore bundles as release assets (D328), writes SHA256SUMS.txt, and fills
  # a draft release. The owner publishes the draft by hand (D314).
  release:
    name: release
    needs: bundle
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - name: Download package artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets="$RUNNER_TEMP/release-assets"
          mkdir -p "$assets"
          for name in InfinitePrep-windows-packages InfinitePrep-linux-packages InfinitePrep-macos-dmg; do
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$name" --dir "$assets"
          done
          ls -l "$assets"
          count="$(find "$assets" -maxdepth 1 -type f | wc -l)"
          if [ "$count" -ne 6 ]; then
            echo "Expected 6 packages, found $count."
            exit 1
          fi
          python packaging/release.py check-assets "$assets" "${GITHUB_REF_NAME#v}"

      # Attest each of the six packages and save its Sigstore bundle (D325, D328).
      - name: Attest Windows portable zip
        id: attest-windows-portable-zip
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release-assets/InfinitePrep-*-windows-x64-portable.zip

      - name: Attest Windows setup installer
        id: attest-windows-setup-exe
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release-assets/InfinitePrep-*-windows-x64-setup.exe

      - name: Attest Linux AppImage
        id: attest-linux-appimage
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release-assets/InfinitePrep-*-linux-x86_64.AppImage

      - name: Attest Linux tar.gz
        id: attest-linux-tar-gz
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release-assets/InfinitePrep-*-linux-x86_64.tar.gz

      - name: Attest Linux portable tar.gz
        id: attest-linux-portable-tar-gz
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release-assets/InfinitePrep-*-linux-x86_64-portable.tar.gz

      - name: Attest macOS DMG
        id: attest-macos-dmg
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release-assets/InfinitePrep-*-macos-arm64.dmg

      - name: Save package attestation bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets="$RUNNER_TEMP/release-assets"
          version="${GITHUB_REF_NAME#v}"
          tag="$GITHUB_REF_NAME"
          repo="$GITHUB_REPOSITORY"
          cp "${{ steps.attest-windows-portable-zip.outputs.bundle-path }}" "$assets/InfinitePrep-$version-windows-x64-portable.zip.sigstore.json"
          cp "${{ steps.attest-windows-setup-exe.outputs.bundle-path }}" "$assets/InfinitePrep-$version-windows-x64-setup.exe.sigstore.json"
          cp "${{ steps.attest-linux-appimage.outputs.bundle-path }}" "$assets/InfinitePrep-$version-linux-x86_64.AppImage.sigstore.json"
          cp "${{ steps.attest-linux-tar-gz.outputs.bundle-path }}" "$assets/InfinitePrep-$version-linux-x86_64.tar.gz.sigstore.json"
          cp "${{ steps.attest-linux-portable-tar-gz.outputs.bundle-path }}" "$assets/InfinitePrep-$version-linux-x86_64-portable.tar.gz.sigstore.json"
          cp "${{ steps.attest-macos-dmg.outputs.bundle-path }}" "$assets/InfinitePrep-$version-macos-arm64.dmg.sigstore.json"
          # A rerun regenerates each bundle with a newer timestamp. The upload
          # step rejects a draft asset whose SHA-256 differs (D316). A rerun
          # therefore reuses each bundle already on the draft (D328).
          # A draft asset is untrusted input. Each reused bundle must verify
          # against this build's package and this repository before reuse.
          if is_draft="$(gh release view "$tag" --repo "$repo" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$is_draft" != "true" ]; then
              echo "Release $tag is already published. This job only fills drafts."
              exit 1
            fi
            existing="$(gh release view "$tag" --repo "$repo" --json assets --jq '.assets[].name')"
            for bundle in "$assets"/*.sigstore.json; do
              bname="$(basename "$bundle")"
              if grep -Fxq -- "$bname" <<<"$existing"; then
                echo "Reusing existing $bname from draft release."
                dl_dir="$(mktemp -d "$RUNNER_TEMP/existing-bundle.XXXXXX")"
                gh release download "$tag" --repo "$repo" --pattern "$bname" --dir "$dl_dir"
                if [ ! -s "$dl_dir/$bname" ]; then
                  echo "Downloaded $bname is absent or empty. Delete the draft asset, then rerun."
                  exit 1
                fi
                gh attestation verify "${bundle%.sigstore.json}" --repo "$repo" --bundle "$dl_dir/$bname"
                cp "$dl_dir/$bname" "$bundle"
              fi
            done
          fi
          python packaging/release.py check-assets "$assets" "$version" --require-bundles

      - name: Write checksums and release notes
        run: |
          python packaging/release.py checksums "$RUNNER_TEMP/release-assets"
          python packaging/release.py notes "${GITHUB_REF_NAME#v}" "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-assets/SHA256SUMS.txt"

      - name: Attest checksums file
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release-assets/SHA256SUMS.txt

      # A rerun reuses the draft. An asset already on the draft must match this
      # build's SHA-256, and a mismatch stops the job (D316). A published
      # release is never changed.
      - name: Upload to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          repo="$GITHUB_REPOSITORY"
          assets="$RUNNER_TEMP/release-assets"
          if is_draft="$(gh release view "$tag" --repo "$repo" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$is_draft" != "true" ]; then
              echo "Release $tag is already published. This job only fills drafts."
              exit 1
            fi
            echo "Reusing the draft release for $tag."
          else
            gh release create "$tag" --repo "$repo" --draft --verify-tag \
              --title "InfinitePrep $tag" \
              --notes-file "$RUNNER_TEMP/release-notes.md" --generate-notes
          fi
          existing="$(gh release view "$tag" --repo "$repo" --json assets --jq '.assets[].name')"
          # The draft may hold only this build's assets. A stray file fails the job.
          while IFS= read -r name; do
            if [ -n "$name" ] && [ ! -f "$assets/$name" ]; then
              echo "The draft holds $name, which this build does not make."
              echo "Delete $name from the draft, then rerun the release job."
              exit 1
            fi
          done <<< "$existing"
          for file in "$assets"/*; do
            name="$(basename "$file")"
            if printf '%s\n' "$existing" | grep -Fxq -- "$name"; then
              # A new folder per asset keeps old downloads apart without deleting anything.
              check="$(mktemp -d "$RUNNER_TEMP/existing-asset.XXXXXX")"
              gh release download "$tag" --repo "$repo" --pattern "$name" --dir "$check"
              old="$(sha256sum "$check/$name" | cut -d ' ' -f 1)"
              new="$(sha256sum "$file" | cut -d ' ' -f 1)"
              if [ "$old" != "$new" ]; then
                echo "$name on the draft has SHA-256 $old, but this build made $new."
                echo "Delete the draft release, then run the tag build again."
                exit 1
              fi
              echo "$name is already on the draft with the same SHA-256."
            else
              gh release upload "$tag" "$file" --repo "$repo"
            fi
          done
          echo "Draft release $tag holds every package and SHA256SUMS.txt. Publish it by hand."
