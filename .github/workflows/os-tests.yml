name: Cross-platform gate tests

# Runs the gate test suite on Windows and macOS. These jobs sat in
# sync-check.yml. That workflow also runs on pull request title and
# description edits, and it cancels the older run of a branch. An edit there
# cancelled a running platform job. This workflow omits the edited event, so
# only a code event starts or replaces a platform run.

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Sorts the change into a class. A change to prose or to the landing site
  # alone is light, and both platform jobs skip it.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      light: ${{ steps.classify.outputs.light }}
    steps:
      # The merge base lookup needs the complete history.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # A push event carries no pull request data, so it compares the pushed
      # commit with the previous one.
      - name: Classify changed paths
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/classify_changed_paths.py --base "$BASE_SHA" --head "$HEAD_SHA"

  # The status function replaces the implicit success check on needs. A
  # failed changes job yields no light flag, and the tests then run.
  tests-windows:
    # The gates run as the launcher named in .claude/settings.json, which
    # only this job can prove resolves on Windows. A hook that fails to
    # start exits non-zero but not 2, which Claude Code treats as a
    # non-blocking error, so every gate would fail open there in silence.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.light != 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Probe configured hook launchers
        run: python scripts/check_hook_launchers.py
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.x'
      - name: Install checker dependencies
        run: python -m pip install --requirement requirements-checkers.txt
      # The compliance scanner tests read GITHUB_EVENT_PATH. A push payload
      # carries no pull request data. The runner ignores a step-level
      # override of GITHUB_* variables. The shell removes the variable, as in
      # ci.yml. The command wraps the runner default pwsh template.
      - name: Run tests
        shell: pwsh -command "Remove-Item Env:GITHUB_EVENT_PATH -ErrorAction SilentlyContinue; . '{0}'; exit $LASTEXITCODE"
        run: python scripts/run_tests.py
      - name: Verify trusted GitHub CLI routing
        run: python -m unittest tests.test_trusted_gh tests.test_gate_parity -v

  tests-macos:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.light != 'true' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Probe configured hook launchers
        run: python3 scripts/check_hook_launchers.py
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.x'
      - name: Install checker dependencies
        run: python -m pip install --requirement requirements-checkers.txt
      # The tests-windows comment explains the unset. Bash runs here.
      - name: Run tests
        shell: env -u GITHUB_EVENT_PATH bash -e {0}
        run: python scripts/run_tests.py
