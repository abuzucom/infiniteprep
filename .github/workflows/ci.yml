---
name: ci

# Runs the repository checks on every pull request and on every push to
# main. The security-review-pr and quality-review-pr callers trigger on
# completion of this workflow by its name. Renaming it stops both reviews.

# A push trigger for every branch starts a second run for each pull request
# commit. The pull_request trigger already covers those commits.
"on":
  push:
    branches: [main]
  pull_request:

# A newer pull request commit replaces the run for the older commit. A push
# to main gets its own group per commit, and its run always completes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Sorts the change into a class. A change to prose or to the landing site
  # alone is light, and test-matrix skips it. Every other job always runs.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      light: ${{ steps.classify.outputs.light }}
    steps:
      # The merge base lookup needs the complete history.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      # A push event carries no pull request data, so it compares the pushed
      # commit with the previous one.
      - name: Classify changed paths
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/classify_changed_paths.py --base "$BASE_SHA" --head "$HEAD_SHA"

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      # The agents checker tests under tests/ import PyYAML.
      - name: Install checker dependencies
        run: python3 -m pip install --requirement requirements-checkers.txt

      # The compliance scanner tests read GITHUB_EVENT_PATH. A push payload
      # carries no pull request data. The runner ignores a step-level
      # override of GITHUB_* variables. The shell unsets the variable.
      - name: Review wiring tests
        run: env -u GITHUB_EVENT_PATH python3 -m unittest discover -s tests -v

      # The checker resolves every action pin to the upstream release that
      # its commit names. The token reads the public tag list of each
      # upstream repository.
      - name: Check action release versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_action_versions.py

  lint-and-style:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - name: Install linter and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install --constraint requirements-lock.txt ruff pytest

      - name: Run Ruff linter
        run: ruff check src tests

      - name: Run Ruff format check
        run: ruff format --check src tests

      - name: Run AST and style invariant suite
        run: pytest -p no:pytest-qt tests/unit/test_code_quality_invariants.py

  # Ruff skips the copied abuzucom/agents gate files. This job lints them
  # with the agents style and prose checks.
  agents-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - name: Run agents lint
        run: make lint PYTHON=python

  # The status function replaces the implicit success check on needs. A
  # failed changes job yields no light flag, and the tests then run.
  test-matrix:
    needs: [changes, lint-and-style]
    if: >-
      ${{ !cancelled() && needs.lint-and-style.result == 'success' &&
      needs.changes.outputs.light != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # The Ubuntu leg runs the suite under coverage, which takes longer than the
    # plain suite. The other legs keep the shorter limit.
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - name: Install Linux Qt headless system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libglib2.0-0 \
            libdbus-1-3 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xfixes0 \
            libfontconfig1 \
            libpulse0 \
            libsndfile1

      - name: Install locked dependencies and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python -m pip install --requirement requirements-checkers.txt
          python -m pip install --no-deps -e .

      # Bash runs on every matrix OS. The checks job explains the unset.
      # The coverage measurement runs on Ubuntu only, so the report costs no
      # second suite run. The other legs run the plain suite.
      - name: Run full test suite
        if: matrix.os != 'ubuntu-latest'
        shell: bash
        run: env -u GITHUB_EVENT_PATH pytest

      - name: Run full test suite under coverage
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: env -u GITHUB_EVENT_PATH coverage run -m pytest

      - name: Write the coverage report
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          coverage report --show-missing --skip-covered --sort=cover > coverage-files.txt
          coverage xml -o coverage.xml
          coverage html
          total="$(coverage report --format=total)"
          {
            echo "## Code coverage"
            echo ""
            echo "Total coverage: ${total}%"
            echo ""
            echo "Files with the least coverage:"
            echo ""
            echo '```text'
            sed -n '1,12p' coverage-files.txt
            echo '```'
          } > coverage-summary.md
          cat coverage-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the coverage summary
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage-summary
          path: |
            coverage-summary.md
            coverage-files.txt
            coverage.xml
          retention-days: 3
          if-no-files-found: error

      - name: Upload the coverage HTML report
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage-html
          path: htmlcov
          retention-days: 3
          if-no-files-found: error

  # The comment job holds the pull request write permission. The job that runs
  # the suite keeps read-only permissions, so no test code can post a comment.
  coverage-comment:
    needs: [changes, test-matrix]
    if: >-
      ${{ !cancelled() && github.event_name == 'pull_request' &&
      needs.test-matrix.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download the coverage summary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: coverage-summary
          path: .

      - name: Comment the coverage on the pull request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- infiniteprep-coverage -->';
            const summary = fs.readFileSync('coverage-summary.md', 'utf8');
            const body = `${marker}\n${summary}`;
            const { owner, repo } = context.repo;
            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const previous = comments.data.find(
              (comment) => comment.body && comment.body.includes(marker),
            );
            if (previous) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: context.issue.number,
                body,
              });
            }
