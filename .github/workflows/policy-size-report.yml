name: Policy Size Report

# Posts the AGENTS.md and assembled policy sizes with their headroom on pull
# requests that touch a policy file. The Convention Sync Check workflow runs
# scripts/check_policy_size.py and fails the pull request on a size breach.
# This workflow only reports.
#
# The workflow_run trigger keeps both jobs on default branch code. The measure
# job reads the pull request head policy files as data through the contents
# API. It never checks out or runs pull request code. The default branch
# checker measures the files and renders the comment from validated numbers.
# One comment per pull request carries the marker and receives each update.
#
# Only the comment job holds a write token. It runs no checkout and no code
# over pull request data. It runs on a separate runner. A process left behind
# by a measure step cannot reach that token.

on:
  workflow_run:
    workflows: ["Convention Sync Check"]
    types: [completed]

# Runs for one head branch queue behind each other. Two runs for one pull
# request cannot both find no comment and both create one.
concurrency:
  group: policy-size-report-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  measure:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      touched: ${{ steps.pr.outputs.touched }}
      number: ${{ steps.pr.outputs.number }}
      comment: ${{ steps.render.outputs.comment }}
    steps:
      - name: Resolve pull request and read head policy files
        id: pr
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const headSha = process.env.HEAD_SHA;
            if (!/^[0-9a-f]{40}$/.test(headSha)) {
              core.setFailed('workflow run head SHA is invalid');
              return;
            }

            // Keep these lists in step with scripts/sync.py. The wiring test
            // tests/test_policy_size_report_wiring.py checks every name.
            const assembledFiles = [
              'AGENTS.md',
              'docs/agent-policy/adoption.md',
              'docs/agent-policy/enforcement.md',
              'docs/agent-policy/clients.md',
              'docs/agent-policy/github.md',
              'docs/agent-policy/security.md',
              'docs/project-orientation.md',
              'docs/agent-policy/source-orientation.md',
            ];
            const generatedCopies = [
              'CLAUDE.md',
              'GEMINI.md',
              'CONVENTIONS.md',
              '.cursorrules',
              '.clinerules',
              '.windsurfrules',
              '.copilot-instructions',
              '.github/copilot-instructions.md',
            ];
            const watched = new Set([...assembledFiles, ...generatedCopies]);
            const maxFileBytes = 1024 * 1024;

            const pulls = await github.paginate(
              github.rest.pulls.list,
              { ...context.repo, state: 'open', per_page: 100 },
            );
            const matches = pulls.filter((pull) => pull.head.sha === headSha);
            if (matches.length !== 1) {
              core.setOutput('touched', 'false');
              return;
            }
            const pull = matches[0];

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              { ...context.repo, pull_number: pull.number, per_page: 100 },
            );
            // A renamed file counts when its new or its old path is a policy
            // file. A rename away from a policy path still gets a report.
            const touched = files.some((file) =>
              watched.has(file.filename) || watched.has(file.previous_filename));
            if (!touched) {
              core.setOutput('touched', 'false');
              return;
            }

            // Every written path is a fixed literal from the list above.
            const headRoot = path.join(process.env.RUNNER_TEMP, 'policy-head');
            for (const name of assembledFiles) {
              let response;
              try {
                response = await github.rest.repos.getContent({
                  ...context.repo, path: name, ref: headSha,
                });
              } catch (error) {
                if (error.status === 404) {
                  continue;
                }
                throw error;
              }
              const entry = response.data;
              if (Array.isArray(entry) || entry.type !== 'file' ||
                  entry.encoding !== 'base64' || entry.size > maxFileBytes) {
                core.setFailed(`${name} at the head revision is not a readable regular file`);
                return;
              }
              const target = path.join(headRoot, name);
              fs.mkdirSync(path.dirname(target), { recursive: true });
              fs.writeFileSync(target, Buffer.from(entry.content, 'base64'));
            }

            core.setOutput('touched', 'true');
            core.setOutput('number', String(pull.number));
            core.setOutput('head_root', headRoot);

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        if: steps.pr.outputs.touched == 'true'
        with:
          persist-credentials: false

      - name: Set up Python
        if: steps.pr.outputs.touched == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.14'

      - name: Measure and render the policy size report
        id: render
        if: steps.pr.outputs.touched == 'true'
        env:
          HEAD_ROOT: ${{ steps.pr.outputs.head_root }}
        run: |
          python scripts/check_policy_size.py --json "$HEAD_ROOT/AGENTS.md" \
            > "$RUNNER_TEMP/policy-size-report.json"
          python scripts/check_policy_size.py --render-markdown \
            "$RUNNER_TEMP/policy-size-report.json" \
            > "$RUNNER_TEMP/policy-size-comment.md"
          cat "$RUNNER_TEMP/policy-size-comment.md" >> "$GITHUB_STEP_SUMMARY"
          # A random delimiter keeps any rendered line from ending the output.
          delimiter="policy_size_comment_$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          {
            echo "comment<<$delimiter"
            cat "$RUNNER_TEMP/policy-size-comment.md"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

  comment:
    needs: measure
    if: needs.measure.outputs.touched == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Post or update the policy size comment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          PR_NUMBER: ${{ needs.measure.outputs.number }}
          COMMENT_BODY: ${{ needs.measure.outputs.comment }}
        with:
          script: |
            // The measure job sets PR_NUMBER from the pull request list. Its
            // render step runs under bash -e, so this job runs only after the
            // renderer wrote a body that starts with the marker.
            const marker = '<!-- policy-size-report -->';
            const issueNumber = Number(process.env.PR_NUMBER);
            const body = process.env.COMMENT_BODY;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { ...context.repo, issue_number: issueNumber, per_page: 100 },
            );
            // Only a marked comment from the Actions bot is this report. The
            // step never edits a comment in which a person quotes the marker.
            const existing = comments.find((comment) =>
              comment.user?.login === 'github-actions[bot]' &&
              (comment.body || '').startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: issueNumber, body,
              });
            }
