---
name: dependency-review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Sorts the change into a class. A change to prose or to the landing site
  # alone is light. It changes no manifest, and the review skips it.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      light: ${{ steps.classify.outputs.light }}
    steps:
      # The merge base lookup needs the complete history.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - name: Classify changed paths
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/classify_changed_paths.py --base "$BASE_SHA" --head "$HEAD_SHA"

  # A failed changes job yields no light flag, and the review then runs.
  dependency-review:
    name: Dependency Review
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.light != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: high
