---
name: security-devops

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  msdo:
    name: Microsoft Security DevOps
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      # The merge base lookup of the classifier needs the complete history.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # A change to prose or to the landing site alone is light, and the scan
      # skips it. A failed classification yields no flag, and the scan runs.
      # A push event carries no pull request data, so it compares the pushed
      # commit with the previous one.
      - name: Classify changed paths
        id: classify
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/classify_changed_paths.py --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Run Microsoft Security DevOps
        if: steps.classify.outputs.light != 'true'
        uses: microsoft/security-devops-action@cf28f87c67770dbaa208cce3665fafc849f77507  # v1.12.1
        id: msdo

      - name: Upload results to Security tab
        if: steps.classify.outputs.light != 'true'
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          sarif_file: ${{ steps.msdo.outputs.sarifFile }}
