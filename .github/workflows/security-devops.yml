---
name: security-devops

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Sorts the change into a class. A change to prose or to the landing site
  # alone is light, and the scan skips it.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      light: ${{ steps.classify.outputs.light }}
    steps:
      # The merge base lookup needs the complete history.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      # A push event carries no pull request data, so it compares the pushed
      # commit with the previous one.
      - name: Classify changed paths
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/classify_changed_paths.py --base "$BASE_SHA" --head "$HEAD_SHA"

  # A failed changes job yields no light flag, and the scan then runs.
  msdo:
    name: Microsoft Security DevOps
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.light != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run Microsoft Security DevOps
        uses: microsoft/security-devops-action@cf28f87c67770dbaa208cce3665fafc849f77507  # v1.12.1
        id: msdo

      - name: Upload results to Security tab
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          sarif_file: ${{ steps.msdo.outputs.sarifFile }}
