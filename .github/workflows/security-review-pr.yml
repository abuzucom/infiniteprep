name: security-review-pr

# Runs the abuzucom/agents-personas foucault security review on infiniteprep
# pull requests after the ci workflow completes. The wrapper loads the
# engine, the foucault policy, and the model adapter from the pinned
# agents-personas commit. This repository supplies no adapter files.
#
# The workflow_run trigger runs default-branch code. Pull request files stay
# review data. The engine publishes a skipped "foucault / security" check for
# a fork pull request and withholds the provider key from it.

"on":
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches-ignore:
      - main

concurrency:
  group: security-review-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  resolve-pr:
    # A ci run for a push to main has no pull request to review. A newer
    # commit cancels the ci run of the older commit. The cancelled run still
    # fires workflow_run, and its commit is no longer a pull request head.
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      same_repository: ${{ steps.resolve.outputs.same_repository }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      base_sha: ${{ steps.resolve.outputs.base_sha }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      head_repo_url: ${{ steps.resolve.outputs.head_repo_url }}
      head_repo_full_name: ${{ steps.resolve.outputs.head_repo_full_name }}
    steps:
      - name: Resolve pull request from workflow run head
        id: resolve
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const workflowRun = context.payload.workflow_run;
            const headSha = workflowRun?.head_sha;
            if (!/^[0-9a-f]{40}$/.test(headSha || "")) {
              core.setFailed("review head SHA is invalid");
              return;
            }

            const baseRepository = `${context.repo.owner}/${context.repo.repo}`;
            const pullRequests = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: headSha,
                per_page: 100,
              },
            );
            const candidates = pullRequests.filter((candidate) =>
              candidate.base?.repo?.full_name?.toLowerCase() ===
              baseRepository.toLowerCase() &&
              candidate.head?.sha?.toLowerCase() === headSha.toLowerCase()
            );
            if (candidates.length !== 1) {
              core.setFailed(
                `expected one pull request for review head, found ${candidates.length}`,
              );
              return;
            }

            const pullRequest = candidates[0];
            const headRepository = pullRequest.head?.repo;
            if (!headRepository?.full_name || !headRepository.clone_url) {
              core.setFailed("pull request head repository metadata is unavailable");
              return;
            }
            const sameRepository =
              headRepository.full_name.toLowerCase() === baseRepository.toLowerCase();

            // Every completed ci run gets a review. A check run carries no
            // trusted producer, since any workflow with checks: write can
            // publish one with any name and title. A prior verdict check
            // therefore never skips the review.
            core.setOutput("same_repository", sameRepository ? "true" : "false");
            core.setOutput("pr_number", String(pullRequest.number));
            core.setOutput("base_sha", pullRequest.base.sha);
            core.setOutput("head_sha", pullRequest.head.sha);
            core.setOutput("head_repo_url", headRepository.clone_url);
            core.setOutput("head_repo_full_name", headRepository.full_name);

  # Sorts the pull request into a change class. The classifier comes from the
  # default branch. The job fetches the pull request head commit as Git
  # objects only. No pull request file reaches a working tree, and no pull
  # request file runs. The job holds a read-only token and no secret. A fork
  # pull request gets no classification. The review job then runs, and the
  # engine publishes the skipped fork check.
  classify:
    needs: resolve-pr
    if: >-
      ${{ needs.resolve-pr.result == 'success' &&
      needs.resolve-pr.outputs.same_repository == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      change_class: ${{ steps.classify.outputs.change_class }}
    steps:
      # A workflow_run job checks out the default branch when no ref is named.
      - name: Check out the trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: trusted-base
          persist-credentials: false
          fetch-depth: 0

      # The base repository serves a fork head through its pull request ref.
      # The token reaches only this fetch, through a one-command header. The
      # checkout above keeps no credential.
      - name: Fetch the pull request head commit
        working-directory: trusted-base
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.resolve-pr.outputs.head_sha }}
        run: |
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid head commit."; exit 1; }
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            fetch --no-tags origin "$HEAD_SHA"

      - name: Classify changed paths
        id: classify
        working-directory: trusted-base
        env:
          BASE_SHA: ${{ needs.resolve-pr.outputs.base_sha }}
          HEAD_SHA: ${{ needs.resolve-pr.outputs.head_sha }}
        run: python3 scripts/classify_changed_paths.py --base "$BASE_SHA" --head "$HEAD_SHA"

  # A docs-only pull request skips the model review. The status function
  # replaces the implicit success check on needs. A failed classify job
  # yields no class, and the review then runs.
  review:
    needs: [resolve-pr, classify]
    if: >-
      ${{ !cancelled() && needs.resolve-pr.result == 'success' &&
      needs.classify.outputs.change_class != 'docs' }}
    # The wrapper posts a pull request comment and publishes a check run.
    permissions:
      checks: write
      contents: read
      pull-requests: write
    # agents-personas 0.22.0. Keep the uses: pin and personas_ref on the same commit.
    uses: abuzucom/agents-personas/.github/workflows/foucault-security-review.yml@c43f4592191b42b9f66072622b082fc2f4dc3217
    with:
      personas_ref: "c43f4592191b42b9f66072622b082fc2f4dc3217"
      pr_comment: true
      fail_on_block: true
      pr_number: ${{ needs.resolve-pr.outputs.pr_number }}
      base_sha: ${{ needs.resolve-pr.outputs.base_sha }}
      head_sha: ${{ needs.resolve-pr.outputs.head_sha }}
      head_repo_url: ${{ needs.resolve-pr.outputs.head_repo_url }}
      head_repo_full_name: ${{ needs.resolve-pr.outputs.head_repo_full_name }}
    secrets:
      MODEL_API_KEY: ${{ secrets.OLLAMA_API_KEY }}

  # The check keeps its name on a docs-only pull request. A required
  # foucault / security check then reports a result.
  docs-only-skipped:
    needs: [resolve-pr, classify]
    if: needs.classify.outputs.change_class == 'docs'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: write
    steps:
      - name: Publish skip result
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          HEAD_SHA: ${{ needs.resolve-pr.outputs.head_sha }}
        with:
          script: |
            await github.rest.checks.create({
              ...context.repo,
              name: 'foucault / security',
              head_sha: process.env.HEAD_SHA,
              status: 'completed',
              conclusion: 'skipped',
              output: {
                title: 'Skipped for docs-only pull request',
                summary: 'The pull request changes documentation files only.',
              },
            });
