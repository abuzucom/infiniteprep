[tool.ruff.lint]
select = ["E", "W", "F", "B", "S", "SIM", "C90", "PL", "I", "UP", "RUF"]
ignore = ["S101", "S310", "S603", "PLR0913", "PLR2004"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pylint]
max-locals = 10
max-nested-blocks = 3
max-branches = 12
max-statements = 50
