[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "infiniteprep"
version = "0.90.0"
description = "Cross-platform DJ music metadata identification, analysis, review, and tag management application"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "ABUZUCOM LLC" }
]
dependencies = [
    "numpy==2.5.4",
    "scipy==1.18.1",
    "soundfile==0.14.0",
    "keyring==25.7.0",
    "platformdirs==4.14.8",
    "PySide6==6.12.0",
    "qt-material==2.17",
    "Jinja2==3.1.6",
    "MarkupSafe==3.0.4",
]

[project.optional-dependencies]
dev = [
    "coverage==7.17.3",
    "pytest==9.2.0",
    "pytest-qt==4.5.0",
    "ruff==0.17.6",
    "pyinstaller==6.22.3",
    "pillow==13.0.0",
]

[project.scripts]
infiniteprep = "infiniteprep.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-v"

[tool.coverage.run]
source = ["src/infiniteprep"]
branch = true
relative_files = true

[tool.coverage.report]
show_missing = true
precision = 1

[tool.ruff]
line-length = 100
target-version = "py311"
