[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "infiniteprep"
version = "0.1.0"
description = "Cross-platform DJ music metadata identification, analysis, review, and tag management application"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "ABUZUCOM LLC" }
]
dependencies = [
    "mutagen==1.48.1",
    "numpy==2.5.4",
    "scipy==1.18.1",
    "soundfile==0.14.0",
    "keyring==25.7.0",
    "platformdirs==4.14.0",
    "PySide6==6.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-qt==4.5.0",
    "ruff==0.17.3",
    "pyinstaller==6.22.3",
]

[project.scripts]
infiniteprep = "infiniteprep.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py311"
# The agents gate files stay byte-identical to abuzucom/agents.
# make lint and scripts/run_tests.py cover them in ci.yml.
