[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "infiniteprep"
version = "0.1.0"
description = "Cross-platform DJ music metadata identification, analysis, review, and tag management application"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "ABUZUCOM LLC" }
]
dependencies = [
    "mutagen==1.48.1",
    "numpy==2.5.4",
    "scipy==1.18.1",
    "soundfile==0.14.0",
    "keyring==25.7.0",
    "platformdirs==4.14.0",
    "PySide6==6.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-qt==4.5.0",
    "ruff==0.17.3",
    "pyinstaller==6.22.3",
]

[project.scripts]
infiniteprep = "infiniteprep.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tests/test_review_wiring.py"]

[tool.ruff.lint]
select = ["E", "W", "F", "B", "S", "SIM", "C90", "PL", "I", "UP", "RUF"]
ignore = ["S101", "S310", "S603", "PLR0913", "PLR2004"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pylint]
max-locals = 10
max-nested-blocks = 3
max-branches = 12
max-statements = 50
